{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Watchlist - CineMax</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body { background:#050505; color:white; }
        .navbar { display:flex; justify-content:space-between; padding:20px 40px; background:rgba(0,0,0,.8); }
        .navbar h1 { color:#00e5ff; }
        .navbar a { color:#bbb; text-decoration:none; margin-left:20px; }
        .container { max-width:1000px; margin:40px auto; padding:0 20px; }
        h2 { color:#00e5ff; margin-bottom:20px; border-left:4px solid #00e5ff; padding-left:12px; }
        .movie-grid { display:flex; gap:20px; flex-wrap:wrap; }
        .movie-card {
            width:180px; border-radius:12px;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);
            overflow:hidden; cursor:pointer; transition:.4s;
        }
        .movie-card:hover { transform:translateY(-10px); border-color:#00e5ff; box-shadow:0 0 30px rgba(0,229,255,.4); }
        .movie-card img { width:100%; height:250px; object-fit:cover; }
        .movie-card .info { padding:10px; }
        .movie-card h3 { font-size:14px; color:white; }
        .remove-btn {
            width:100%; padding:8px; background:#f44336;
            color:white; border:none; cursor:pointer; font-size:13px;
        }
        .empty { color:#bbb; font-style:italic; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>🎬 CineMax</h1>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

    <div class="container">
        <h2>🎯 My Watchlist</h2>

        {% if watchlist %}
        <div class="movie-grid">
            {% for item in watchlist %}
            <div class="movie-card" id="card-{{ item.movie.id }}">
                <div onclick="window.location.href='{% url 'movie_detail' item.movie.id %}'">
                    {% if item.movie.poster %}
                        <img src="{{ item.movie.poster.url }}" alt="{{ item.movie.title }}">
                    {% endif %}
                    <div class="info">
                        <h3>{{ item.movie.title }}</h3>
                        <p style="color:#bbb;font-size:12px;">{{ item.movie.genre }}</p>
                    </div>
                </div>
                <button
                    class="remove-btn"
                    onclick="removeFromWatchlist({{ item.movie.id }})">
                    🗑 Remove
                </button>
            </div>
            {% endfor %}
        </div>
        {% else %}
            <p class="empty">Your watchlist is empty. Go add some movies!</p>
        {% endif %}
    </div>

    <script>
        // Remove from watchlist using JS fetch
        async function removeFromWatchlist(movieId) {
            const response = await fetch('/watchlist/remove/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ movie_id: movieId })
            })

            const data = await response.json()

            if (data.success) {
                // Remove the card from page without reloading
                document.getElementById(`card-${movieId}`).remove()
            }
        }

        function getCookie(name) {
            let cookieValue = null
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';')
                for (let cookie of cookies) {
                    cookie = cookie.trim()
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1))
                        break
                    }
                }
            }
            return cookieValue
        }
    </script>

</body>
</html>
